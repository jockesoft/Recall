# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Nightly build

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    # The PostgreSQL suite pulls dhi.io/postgres and dhi.io/valkey through Testcontainers, which
    # needs a Docker Hub login for Docker Hardened Images.
    - name: Log in to Docker Hardened Images
      uses: docker/login-action@v4
      with:
        registry: dhi.io
        username: ${{ secrets.DHI_USERNAME }}
        password: ${{ secrets.DHI_TOKEN }}
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        # The SDK global.json names (10.0.404 at least; any later .NET 10 SDK is accepted).
        global-json-file: global.json

    - name: Restore dependencies
      run: dotnet restore

    - name: NuGet audit
      # Packages with a known vulnerability are warnings, never errors
      # (Directory.Build.props), so a new advisory cannot block a build.
      # This step makes them visible: one annotation per package on the run.
      run: |
        dotnet list package --vulnerable --include-transitive 2>&1 | tee nuget-audit.txt
        if grep -q "has the following vulnerable packages" nuget-audit.txt; then
          grep -E '^ +>' nuget-audit.txt | sed -E 's/^ +> +//' | while read -r line; do
            echo "::warning title=NuGet audit::Vulnerable package: $line"
          done
        fi

    - name: Build (Release)
      run: dotnet build --configuration Release --no-restore

    - name: Test with Coverage
      run: dotnet test --configuration Release
