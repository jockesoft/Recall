# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Nightly build

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    # The PostgreSQL suite pulls dhi.io/postgres and dhi.io/valkey through Testcontainers, which
    # needs a Docker Hub login for Docker Hardened Images.
    - name: Log in to Docker Hardened Images
      uses: docker/login-action@v4
      with:
        registry: dhi.io
        username: ${{ secrets.DHI_USERNAME }}
        password: ${{ secrets.DHI_TOKEN }}
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        # The SDK global.json names (the latest .NET 10 patch, rolling forward within its band).
        global-json-file: global.json

    - name: Restore dependencies
      run: dotnet restore

    - name: Build (Release)
      run: dotnet build --configuration Release --no-restore

    - name: Test with Coverage
      run: dotnet test --configuration Release
