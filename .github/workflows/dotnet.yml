# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Recall CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  packages: write

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Docker Hardened Images (dhi.io) need a Docker Hub login to pull. The
      # PostgreSQL suite's Testcontainers pull dhi.io/valkey with these
      # credentials (it reads the runner's Docker config).
      - name: Log in to Docker Hardened Images
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Recall.sln

      - name: Build (Release)
        run: dotnet build Recall.sln --configuration Release --no-restore

      - name: Test with Coverage
        run: dotnet test Recall.Tests --configuration Release --no-restore --settings Recall.Tests/coverlet.runsettings --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

      # Starts postgres:18.1 and dhi.io/valkey:9.1 containers through Testcontainers
      # (the runner has Docker). CI=true makes an unreachable Docker a failure, not
      # a skipped suite.
      - name: Test against PostgreSQL
        run: dotnet test Recall.Tests.Postgres --configuration Release --no-build --verbosity normal

      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/**/coverage.cobertura.xml
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '60 80'

      - name: Upload coverage summary
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: code-coverage-results.md

  build_and_deploy:
    needs: build_and_test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set build number
        run: echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
  
      - name: Print new build number
        run: echo "Build number is $BUILD_NUMBER"
  
      - name: Write build number to file
        run: echo "$BUILD_NUMBER" > build.txt

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ secrets.GHCR_USERNAME }}/recall:latest
            ghcr.io/${{ secrets.GHCR_USERNAME }}/recall:${{ env.BUILD_NUMBER }}

      # The server-side files come from the repository: compose.prod.yml and
      # deploy/dump_db.sh are uploaded under temporary names and put in place by
      # the deploy script below, which keeps the previous ones as *.prev.
      # .env.prod stays on the server.
      - name: Stage server files for upload
        run: |
          mkdir -p deploy-upload
          cp compose.prod.yml deploy-upload/compose.prod.yml.incoming
          cp deploy/dump_db.sh deploy-upload/dump_db.sh.incoming

      - name: Upload server files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: deploy-upload/compose.prod.yml.incoming,deploy-upload/dump_db.sh.incoming
          target: /home/${{ secrets.SSH_USER }}/recall-deploy
          strip_components: 1
          overwrite: true

      - name: Deploy on remote server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # set -e: the action no longer stops at a failing command by itself.
          script: |
            set -eu
            cd /home/${{ secrets.SSH_USER }}/recall-deploy

            # Keep the running files for a one-command rollback, then take the repository's.
            # dump_db.sh keeps its name and place: the daily backup cron job runs it from here.
            if [ -f compose.prod.yml ]; then cp compose.prod.yml compose.prod.yml.prev; fi
            if [ -f dump_db.sh ]; then cp -p dump_db.sh dump_db.sh.prev; fi
            mv compose.prod.yml.incoming compose.prod.yml
            mv dump_db.sh.incoming dump_db.sh
            chmod 750 dump_db.sh

            # Nothing is pulled or started until the file and .env.prod agree: every
            # variable compose.prod.yml interpolates is required, so a missing one fails
            # here. On failure both previous files are put back, so the folder still
            # describes what is running (never a mix) and the .prev copies stay good
            # for the next deploy.
            if ! docker compose --env-file .env.prod -f compose.prod.yml config -q; then
              echo "compose.prod.yml does not validate with .env.prod; restored the previous compose.prod.yml and dump_db.sh, nothing was deployed." >&2
              if [ -f compose.prod.yml.prev ]; then cp compose.prod.yml.prev compose.prod.yml; fi
              if [ -f dump_db.sh.prev ]; then cp -p dump_db.sh.prev dump_db.sh; fi
              exit 1
            fi

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin
            bash dump_db.sh
            docker compose --env-file .env.prod -f compose.prod.yml up -d --pull always --quiet-pull
            docker image prune -f