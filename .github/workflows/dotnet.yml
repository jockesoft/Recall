# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Recall CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  packages: write

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.400

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Recall.sln

      - name: Prepare build directory
        run: mkdir -p Recall.Web/bin/Release

      - name: Inspect filesystem
        run: |
          echo "=== Web directory ==="
          find Recall.Web -maxdepth 2 -type d -print

          echo "=== Root directories ==="
          find . -maxdepth 2 -type d -print

          echo "=== Files/directories containing backslashes ==="
          find . -print0 | while IFS= read -r -d '' f; do
            if [[ "$f" == *'\'* ]]; then
              printf '%s\n' "$f"
            fi
          done

          echo "=== Files/directories containing colon ==="
          find . -print0 | while IFS= read -r -d '' f; do
            if [[ "$f" == *':'* ]]; then
              printf '%s\n' "$f"
            fi
          done

      - name: Build Web
        run: dotnet build Recall.Web/Recall.Web.csproj --configuration Release

      - name: Test with Coverage
        run: dotnet test Recall.sln --configuration Release --no-restore --settings Recall.Tests/coverlet.runsettings --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/**/coverage.cobertura.xml
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '60 80'

      - name: Upload coverage summary
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: code-coverage-results.md

  build_and_deploy:
    needs: build_and_test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set build number
        run: echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV
  
      - name: Print new build number
        run: echo "Build number is $BUILD_NUMBER"
  
      - name: Write build number to file
        run: echo "$BUILD_NUMBER" > build.txt
