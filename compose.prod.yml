# Shipped by the deploy (build_and_deploy in .github/workflows/dotnet.yml): the
# repository's copy replaces the server's on every deploy, so change it here,
# never on the server. Values come from .env.prod, the one file kept by hand on
# the server. Every variable this file interpolates is required (${NAME:?...}),
# so a missing one fails "docker compose config -q" before anything is pulled
# or started, instead of quietly becoming empty.
services:
  recall:
    container_name: recall_app
    restart: unless-stopped
    image: ghcr.io/jockesoft/recall:latest
    ports:
      - "127.0.0.1:8701:8701"
    env_file:
      - .env.prod
    # The image runs as UID 65532 (nonroot) and checks itself (HEALTHCHECK in
    # Dockerfile.prod). Both folders must be owned by 65532 on the server: the app
    # refuses to start when it cannot write its Data Protection keys.
    volumes:
      - ./logs:/var/log/recallapp  # local path:docker path
      - ./dataprotection-keys:/home/nonroot/.aspnet/DataProtection-Keys
#      - ./images/recipes:/app/wwwroot/images/recipes
    depends_on:
      # restart: the app restarts whenever compose replaces the database
      # container, so its startup checks (an empty database stops it) run
      # against the database it now talks to, even when its own image is unchanged.
      postgres:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
    networks:
      - recall_prodnet

  # PostgreSQL on Docker's hardened image (runs as UID 70, has bash and
  # pg_isready, so the healthcheck works as it did). Its data directory is
  # /var/lib/postgresql/18/data (the image's PGDATA) on the volume below.
  postgres:
    image: dhi.io/postgres:18.7-debian13
    container_name: ${POSTGRES_HOST:?POSTGRES_HOST must be set in .env.prod}
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER must be set in .env.prod} -d ${POSTGRES_DB:?POSTGRES_DB must be set in .env.prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env.prod}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.prod}
    ports: # Not needed in prod?? According to AI but needed to be able to connect from host machine for testing/debugging. Can be removed if not needed.
      - "127.0.0.1:5433:${POSTGRES_PORT:?POSTGRES_PORT must be set in .env.prod}"
    volumes:
      - pgdata_dhi:/var/lib/postgresql
    networks:
      - recall_prodnet

  # Valkey (Docker Hardened Image) as a pure cache: no snapshots, no append-only
  # file, 256 MB with LRU eviction. The service keeps the name "redis" so
  # REDIS_CONNECTION=redis:6379,password=... still resolves. The hardened image
  # keeps protected mode on, which refuses other containers unless a password
  # is set, so it has one: VALKEY_PASSWORD from .env.prod (compose refuses to
  # start without it). VALKEYCLI_AUTH lets the healthcheck authenticate, and -e
  # makes valkey-cli exit non-zero on an error reply such as NOAUTH.
  redis:
    image: dhi.io/valkey:9.1
    restart: unless-stopped
    environment:
      VALKEYCLI_AUTH: ${VALKEY_PASSWORD:?VALKEY_PASSWORD must be set in .env.prod}
    healthcheck:
      test: ["CMD", "valkey-cli", "-e", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--requirepass", "${VALKEY_PASSWORD:?VALKEY_PASSWORD must be set in .env.prod}"]
    networks:
      - recall_prodnet

volumes:
  # The database since the move to the hardened image (README, "Switching
  # production to DHI Postgres"). External: compose never creates or removes
  # it, so a deploy cannot start on a new, empty volume by mistake (and the app
  # refuses an empty database too). It is created by hand, once:
  # docker volume create recall_pgdata_dhi
  pgdata_dhi:
    name: recall_pgdata_dhi
    external: true
  # The rollback copy: the postgres:18.1 data from before the switch, no longer
  # mounted. Declared so it stays known to compose; never run "down -v", which
  # would remove it. Delete it by hand a few weeks after the switch (README).
  pgdata:

networks:
  recall_prodnet:
