services:
  recall:
    container_name: recall_app
    restart: unless-stopped
    image: ghcr.io/jockesoft/recall:latest
    ports:
      - "127.0.0.1:8701:8701"
    env_file:
      - .env.prod
    volumes:
      - ./logs:/var/log/recallapp  # local path:docker path
      - ./dataprotection-keys:/home/app/.aspnet/DataProtection-Keys
#      - ./images/recipes:/app/wwwroot/images/recipes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - recall_prodnet

  postgres:
    image: postgres:18.1
    container_name: ${POSTGRES_HOST}
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: # Not needed in prod?? According to AI but needed to be able to connect from host machine for testing/debugging. Can be removed if not needed.
      - "127.0.0.1:5433:${POSTGRES_PORT}"
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - recall_prodnet

  # Valkey (Docker Hardened Image) as a pure cache: no snapshots, no append-only
  # file, 256 MB with LRU eviction. The service keeps the name "redis" so
  # REDIS_CONNECTION=redis:6379,password=... still resolves. The hardened image
  # keeps protected mode on, which refuses other containers unless a password
  # is set, so it has one: VALKEY_PASSWORD from .env.prod (compose refuses to
  # start without it). VALKEYCLI_AUTH lets the healthcheck authenticate, and -e
  # makes valkey-cli exit non-zero on an error reply such as NOAUTH.
  redis:
    image: dhi.io/valkey:9.1
    restart: unless-stopped
    environment:
      VALKEYCLI_AUTH: ${VALKEY_PASSWORD:?VALKEY_PASSWORD must be set in .env.prod}
    healthcheck:
      test: ["CMD", "valkey-cli", "-e", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--requirepass", "${VALKEY_PASSWORD:?VALKEY_PASSWORD must be set in .env.prod}"]
    networks:
      - recall_prodnet

volumes:
  pgdata:

networks:
  recall_prodnet:
